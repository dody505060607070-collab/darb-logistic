# FREE TEMPORARY TEST HOSTING ONLY: one stateless bridge and no paid resources.
services:
  - type: web
    name: darb-petroapp-bridge
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: petroapp-bridge
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /livez
    autoDeployTrigger: checksPass
    envVars:
      - key: PETROAPP_RAE_BRIDGE_TOKEN
        sync: false
      - key: PETROAPP_BEARER_TOKEN
        sync: false
      - key: PETROAPP_FINGERPRINT
        sync: false
      - key: PETROAPP_PAYMENT_STATUS_MAP
        value: "{}"
