name: Darb Hostinger CI/CD

on:
  push:
    branches: [main, migration/hostinger-full-stack-2026-11-28]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: darb-hostinger-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      has_db_migrations: ${{ steps.migrations.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test
      - name: Full lint baseline (non-blocking until existing baseline is cleaned)
        continue-on-error: true
        run: bun run lint
      - name: Lint migration provider and health endpoint
        run: bunx eslint src/lib/ai-provider.server.ts src/routes/api/health.ts
      - name: Node production build
        env:
          VITE_SUPABASE_URL: https://supabase-ci.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          VITE_SUPABASE_PROJECT_ID: darb-ci
        run: bun run build
      - name: Build and smoke-test app container
        env:
          VITE_SUPABASE_URL: https://supabase-ci.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          VITE_SUPABASE_PROJECT_ID: darb-ci
        shell: bash
        run: |
          set -euo pipefail
          docker build --build-arg VITE_SUPABASE_URL="$VITE_SUPABASE_URL" \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY="$VITE_SUPABASE_PUBLISHABLE_KEY" \
            --build-arg VITE_SUPABASE_PROJECT_ID="$VITE_SUPABASE_PROJECT_ID" \
            --tag darb-app-ci:"$GITHUB_SHA" .
          name="darb-ci-$GITHUB_RUN_ID"
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "$name" -p 127.0.0.1:33001:3000 \
            -e PORT=3000 -e HOST=0.0.0.0 "darb-app-ci:$GITHUB_SHA"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:33001/api/health; then exit 0; fi
            sleep 2
          done
          docker logs "$name"
          exit 1
      - name: PetroApp bridge tests and type check
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: petroapp-bridge/requirements-dev.txt
      - run: pip install -r petroapp-bridge/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: petroapp-bridge
      - run: python -m mypy app tests
        working-directory: petroapp-bridge
      - name: Prepare and validate isolated Supabase + Darb Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          export DARB_REPO_ROOT="$GITHUB_WORKSPACE"
          export DARB_SUPABASE_DIR="$RUNNER_TEMP/darb-supabase"
          export DARB_CONFIG_DIR="$RUNNER_TEMP/darb-config"
          bash ops/hostinger/prepare-supabase.sh
          cat >> "$DARB_CONFIG_DIR/compose.env" <<EOF
          DARB_APP_BIND_PORT=33002
          DARB_SUPABASE_HTTP_BIND_PORT=33003
          DARB_SUPABASE_DB_BIND_PORT=33004
          DARB_SUPABASE_POOLER_BIND_PORT=33005
          DARB_APP_IMAGE=ghcr.io/example/darb-app:ci
          DARB_PETROAPP_BRIDGE_IMAGE=ghcr.io/example/darb-petroapp-bridge:ci
          DARB_MIGRATION_IMAGE=ghcr.io/example/darb-migration:ci
          EVOLUTION_API_IMAGE=ghcr.io/example/evolution-api:v2.3.8
          EOF
          set -a
          . "$DARB_CONFIG_DIR/compose.env"
          set +a
          docker compose -p darb-logistic-prod \
            --env-file "$DARB_SUPABASE_DIR/docker/.env" \
            -f "$DARB_SUPABASE_DIR/docker/docker-compose.yml" \
            -f "$GITHUB_WORKSPACE/ops/hostinger/compose.darb.yml" config --quiet
      - name: Detect database migration changes
        id: migrations
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          if git diff --name-only "$base" "$GITHUB_SHA" | grep -q '^drizzle/migrations/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HOSTINGER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require target public Supabase build settings
        env:
          DARB_VITE_SUPABASE_URL: ${{ vars.DARB_VITE_SUPABASE_URL }}
          DARB_VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.DARB_VITE_SUPABASE_PUBLISHABLE_KEY }}
          DARB_VITE_SUPABASE_PROJECT_ID: ${{ vars.DARB_VITE_SUPABASE_PROJECT_ID }}
        run: |
          test -n "$DARB_VITE_SUPABASE_URL"
          test -n "$DARB_VITE_SUPABASE_PUBLISHABLE_KEY"
          test -n "$DARB_VITE_SUPABASE_PROJECT_ID"
      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push Darb application
        env:
          DARB_VITE_SUPABASE_URL: ${{ vars.DARB_VITE_SUPABASE_URL }}
          DARB_VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.DARB_VITE_SUPABASE_PUBLISHABLE_KEY }}
          DARB_VITE_SUPABASE_PROJECT_ID: ${{ vars.DARB_VITE_SUPABASE_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/darb-app:$GITHUB_SHA"
          docker build --build-arg VITE_SUPABASE_URL="$DARB_VITE_SUPABASE_URL" \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY="$DARB_VITE_SUPABASE_PUBLISHABLE_KEY" \
            --build-arg VITE_SUPABASE_PROJECT_ID="$DARB_VITE_SUPABASE_PROJECT_ID" \
            --tag "$image" .
          docker push "$image"
      - name: Build and push PetroApp bridge
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/darb-petroapp-bridge:$GITHUB_SHA"
          docker build -f petroapp-bridge/Dockerfile --tag "$image" petroapp-bridge
          docker push "$image"
      - name: Build and push database migration image
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/darb-migration:$GITHUB_SHA"
          docker build -f Dockerfile.migrate --tag "$image" .
          docker push "$image"

  deploy:
    needs: [validate, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HOSTINGER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_SSH_KEY"
          test -n "$HOSTINGER_SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTINGER_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Validate deployment target settings
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_SSH_HOST"
          test -n "$HOSTINGER_SSH_USER"
          test -n "$HOSTINGER_DEPLOY_PATH"
          test -n "$GHCR_USERNAME"
          test -n "$GHCR_READ_TOKEN"
          [[ "$HOSTINGER_DEPLOY_PATH" =~ ^/[A-Za-z0-9/_-]+$ ]]
      - name: Copy Darb deployment scripts only
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" "mkdir -p '$HOSTINGER_DEPLOY_PATH/ops'"
          scp -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -r \
            ops/hostinger "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST:$HOSTINGER_DEPLOY_PATH/ops/"
      - name: Authenticate Hostinger Docker to GHCR
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_READ_TOKEN" | ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"
      - name: Deploy app and bridge only
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
          HAS_DB_MIGRATIONS: ${{ needs.validate.outputs.has_db_migrations }}
        shell: bash
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          app="ghcr.io/$owner/darb-app:$GITHUB_SHA"
          bridge="ghcr.io/$owner/darb-petroapp-bridge:$GITHUB_SHA"
          migration="ghcr.io/$owner/darb-migration:$GITHUB_SHA"
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" \
            "DARB_REPO_ROOT='$HOSTINGER_DEPLOY_PATH' DARB_SUPABASE_DIR='$HOSTINGER_DEPLOY_PATH/supabase' DARB_CONFIG_DIR='$HOSTINGER_DEPLOY_PATH/config' bash '$HOSTINGER_DEPLOY_PATH/ops/hostinger/deploy-app.sh' '$app' '$migration' '$HAS_DB_MIGRATIONS'"
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" \
            "DARB_REPO_ROOT='$HOSTINGER_DEPLOY_PATH' DARB_SUPABASE_DIR='$HOSTINGER_DEPLOY_PATH/supabase' DARB_CONFIG_DIR='$HOSTINGER_DEPLOY_PATH/config' bash '$HOSTINGER_DEPLOY_PATH/ops/hostinger/deploy-bridge.sh' '$bridge'"
