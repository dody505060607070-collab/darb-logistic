name: Hostinger candidate validation

on:
  push:
    branches:
      - migration/hostinger-full-stack-2026-11-28
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: darb-hostinger-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test
      - name: Full lint baseline (reported, not a deployment gate)
        continue-on-error: true
        run: bun run lint
      - name: Lint new health route
        run: bunx eslint src/routes/api/health.ts
      - name: Production Node build
        run: bun run build
      - name: Verify Node server artifact
        run: test -f .output/server/index.mjs && test -d .output/public
      - name: Build production Docker image
        run: docker build --tag darb-hostinger-candidate:${{ github.sha }} .
      - name: Smoke test production container
        shell: bash
        run: |
          set -euo pipefail
          name="darb-candidate-${GITHUB_RUN_ID}"
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$name" -p 127.0.0.1:33001:3000 \
            -e PORT=3000 -e HOST=0.0.0.0 \
            "darb-hostinger-candidate:${GITHUB_SHA}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:33001/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$name"
          exit 1

  petroapp-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: petroapp-bridge/requirements-dev.txt
      - name: Install bridge test dependencies
        run: pip install -r petroapp-bridge/requirements-dev.txt
      - name: Bridge tests
        working-directory: petroapp-bridge
        run: python -m pytest -q
      - name: Bridge type check
        working-directory: petroapp-bridge
        run: python -m mypy app tests
