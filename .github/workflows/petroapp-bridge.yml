name: PetroApp bridge

on:
  push:
    paths:
      - "petroapp-bridge/**"
      - "render.yaml"
      - ".github/workflows/petroapp-bridge.yml"
  pull_request:
    paths:
      - "petroapp-bridge/**"
      - "render.yaml"
      - ".github/workflows/petroapp-bridge.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: petroapp-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: petroapp-bridge/requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install --no-cache-dir --requirement requirements-dev.txt
      - name: Run mocked tests
        run: python -m pytest -q
      - name: Type-check bridge
        run: python -m mypy app tests
